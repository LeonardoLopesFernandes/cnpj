name: Build & Release APK (arm64-v8a)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build APK release (arm64-v8a, menor)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: List outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/consulta-cnpj-${{ github.ref_name }}-arm64-v8a.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Consulta CNPJ ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/consulta-cnpj-${{ github.ref_name }}-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: consulta-cnpj-arm64-v8a-release
          path: build/app/outputs/flutter-apk/consulta-cnpj-*-arm64-v8a.apk
          if-no-files-found: error
